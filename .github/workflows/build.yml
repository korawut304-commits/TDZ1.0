name: Build TDZ 1.0 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TDZ1.0.love'
      - '.github/workflows/build-apk.yml'
      - 'android-res/**'
      - '**.png'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get game files
        uses: actions/checkout@v4

      - name: Verify TDZ1.0.love exists
        run: |
          test -f "./TDZ1.0.love"
          ls -lh "./TDZ1.0.love"

      - name: Prepare resources
        run: |
          mkdir -p android-res/values

          if [ ! -f android-res/values/strings.xml ]; then
            cat << 'EOF' > android-res/values/strings.xml
          <resources>
            <string name="app_name">TDZ 1.0</string>
          </resources>
          EOF
          fi

          ICON_SRC=""
          for candidate in "./icon.png" "./android-res/icon.png" "./res/icon.png" "./assets/icon.png"; do
            if [ -f "$candidate" ]; then
              ICON_SRC="$candidate"
              break
            fi
          done

          if [ -z "$ICON_SRC" ]; then
            ICON_SRC=$(find . -maxdepth 3 -type f -iname "*icon*.png" ! -path "./.git/*" ! -path "./android-res/mipmap-*" ! -path "./android-res/drawable-*" | head -n 1)
          fi

          if [ -n "$ICON_SRC" ]; then
            echo "Using icon source: $ICON_SRC"
            declare -A DENSITIES=(
              ["mipmap-mdpi"]="48x48"
              ["mipmap-hdpi"]="72x72"
              ["mipmap-xhdpi"]="96x96"
              ["mipmap-xxhdpi"]="144x144"
              ["mipmap-xxxhdpi"]="192x192"
            )

            for folder in "${!DENSITIES[@]}"; do
              mkdir -p "android-res/$folder"
              mkdir -p "android-res/drawable-${folder#mipmap-}"
              size="${DENSITIES[$folder]}"
              out_mipmap="android-res/$folder/ic_launcher.png"
              out_drawable="android-res/drawable-${folder#mipmap-}/ic_launcher.png"

              if command -v convert >/dev/null 2>&1; then
                convert "$ICON_SRC" -resize "${size}!" "$out_mipmap"
              elif command -v ffmpeg >/dev/null 2>&1; then
                w="${size%x*}"
                h="${size#*x}"
                ffmpeg -y -i "$ICON_SRC" -vf "scale=${w}:${h}" "$out_mipmap" >/dev/null 2>&1
              else
                cp "$ICON_SRC" "$out_mipmap"
              fi
              cp "$out_mipmap" "$out_drawable"
            done
          else
            echo "WARNING: No icon PNG found in repo! Default LÖVE icon will be used."
          fi

          echo "--- Generated android-res files ---"
          find android-res -type f | sort

      - name: Build Android APK
        uses: love-actions/love-actions-android@v2
        with:
          app-name: "TDZ 1.0"
          bundle-id: "com.korawut.tdz1"
          resource-path: "./android-res"
          love-ref: "11.5"
          love-package: "./TDZ1.0.love"
          product-name: "tdz1"
          version-string: "1.0"
          version-code: 100
          output-folder: "./build"
          icon-specifier: "@mipmap/ic_launcher"

      - name: Check build output
        run: |
          ls -laR ./build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TDZ1.0-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
